# Example BExport armor-set YAML (structure only).
# Generate a live file with /bexport exportarmor <name>.

name: ruby_set
type: ARMOR_SET
exported-at: "2026-11-21T00:00:00Z"
exported-by: Admin
paper-bytes-set:
